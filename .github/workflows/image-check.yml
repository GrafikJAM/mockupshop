name: image-check
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: find-resized-urls
        run: |
          curl -sL https://www.grafikjam.shop/ > page.html
          grep -o '/_next/image?url=[^"& ]*&amp;w=[0-9]*&amp;q=75' page.html | sed 's/&amp;/\&/g' | sort -u | head -8 > urls.txt
          [ "$(wc -l < urls.txt)" -ge 3 ]
      - name: no-direct-supabase-or-dropbox
        run: '[ "$(grep -oE "src=\"https://[^\"]*(supabase\.co|dropbox)[^\"]*\"" page.html | wc -l)" -eq 0 ]'
      - name: images-return-200
        run: |
          while read u; do [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: image/webp,image/*' "https://www.grafikjam.shop$u")" = 200 ] || exit 1; done < urls.txt
      - name: images-are-webp
        run: |
          while read u; do curl -s -o /dev/null -w '%{content_type}\n' -H 'Accept: image/webp,image/*' "https://www.grafikjam.shop$u" | grep -q webp || exit 1; done < urls.txt
      - name: images-under-1500kb
        run: |
          while read u; do [ "$(curl -s -o /dev/null -w '%{size_download}' -H 'Accept: image/webp,image/*' "https://www.grafikjam.shop$u")" -lt 1500000 ] || exit 1; done < urls.txt
