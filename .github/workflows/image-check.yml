name: image-check
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          html=$(curl -sL https://www.grafikjam.shop/)
          echo "$html" | grep -o '/_next/image?url=[^"& ]*&amp;w=[0-9]*&amp;q=75' | sed 's/&amp;/\&/g' | sort -u | head -5 > urls.txt
          echo "found $(wc -l < urls.txt) sample urls"
          while read u; do curl -s -o /dev/null -w "%{http_code} %{content_type} %{size_download}B  $u\n" "https://www.grafikjam.shop$u" | cut -c1-160; done < urls.txt
          echo "direct supabase/dropbox img src count:"; echo "$html" | grep -oE 'src="https://[^"]*(supabase\.co|dropbox)[^"]*"' | wc -l
